<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quality Review</title>
<script>
  // اللغة والوضع قبل الرسم لتجنب الوميض
  try {
    var l = localStorage.getItem('qr.lang') === 'en' ? 'en' : 'ar';
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
    var th = localStorage.getItem('qr.theme');
    if (th) document.documentElement.dataset.theme = th;
  } catch (e) {}
</script>
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="home">
<header class="topbar"></header>

<main>
  <form id="analyze-form" novalidate>
    <section class="hero">
      <div class="hero-art" aria-hidden="true">
        <div class="block b1"></div>
        <div class="block b2"></div>
        <div class="block b3"></div>
        <div class="window">
          <div class="win-bar"><i></i><i></i><i></i><span></span></div>
          <div class="win-body">
            <div class="win-side"><b></b><b></b><b></b><b></b></div>
            <div class="win-main">
              <div class="arch"></div>
              <div class="mini-chart"><s style="height:30%"></s><s style="height:52%"></s><s style="height:74%"></s><s style="height:96%"></s></div>
            </div>
          </div>
        </div>
        <div class="glass-stack">
          <div class="glass"><svg class="i"><use href="#i-pointer"/></svg><span>UX</span></div>
          <div class="glass"><svg class="i"><use href="#i-user"/></svg><span>CX</span></div>
          <div class="glass"><svg class="i"><use href="#i-chart"/></svg><span>Analytics</span></div>
          <div class="glass"><svg class="i"><use href="#i-access"/></svg><span>A11y</span></div>
        </div>
      </div>

      <div class="hero-copy">
        <h1><span data-i18n="home.title1"></span><br><span data-i18n="home.title2"></span></h1>
        <p class="lead" data-i18n="home.lead"></p>

        <div class="mode-url" data-mode="url">
          <div class="url-bar">
            <label class="url-field">
              <svg class="i"><use href="#i-link"/></svg>
              <input type="url" name="url" id="url" dir="ltr" data-i18n-ph="home.url_ph" data-i18n-aria="tab.url" autocomplete="url">
            </label>
            <button type="submit" class="btn primary big"><span data-i18n="home.start"></span><svg class="i flip"><use href="#i-arrow"/></svg></button>
          </div>
          <p class="note"><svg class="i"><use href="#i-lock"/></svg><span data-i18n="home.note"></span></p>
        </div>

        <div class="mode-file" data-mode="file" hidden>
          <label class="dropzone" id="dropzone">
            <input type="file" id="files" multiple accept=".png,.jpg,.jpeg,.txt,.md,.json,.har,.html,.htm">
            <span class="dz-icon"><svg class="i"><use href="#i-upload"/></svg></span>
            <strong data-i18n="drop.title"></strong>
            <small dir="ltr">png · jpg · txt · md · json · har · html</small>
          </label>
          <ul id="file-list" class="file-chips"></ul>
        </div>

        <p class="mode-switch">
          <button type="button" class="linkish" id="to-files" data-mode="url"><svg class="i"><use href="#i-clip"/></svg><span data-i18n="home.or_files"></span></button>
          <button type="button" class="linkish" id="to-url" data-mode="file" hidden><svg class="i"><use href="#i-link"/></svg><span data-i18n="home.back_url"></span></button>
        </p>
      </div>
    </section>

    <div class="container">
      <div id="form-errors" class="errors" role="alert" hidden></div>

      <details class="panel options" id="journey-box">
        <summary>
          <svg class="i"><use href="#i-list"/></svg>
          <span class="sum-title" id="journey-title"></span>
          <span class="sum-badge" id="journey-badge"></span>
          <svg class="i chev"><use href="#i-chevron"/></svg>
        </summary>

        <div class="options-body">
          <div class="grid-2" data-mode="url">
            <label class="field">
              <span data-i18n="f.user"></span>
              <input name="test_username" dir="ltr" autocomplete="off">
            </label>
            <label class="field">
              <span data-i18n="f.pass"></span>
              <input name="test_password" type="password" dir="ltr" autocomplete="new-password">
            </label>
          </div>
          <div class="grid-2">
            <label class="field">
              <span data-i18n="f.product"></span>
              <input name="product_name" id="product_name">
            </label>
            <label class="field">
              <span data-i18n="f.journey"></span>
              <input name="journey" data-i18n-ph="f.journey_ph">
            </label>
          </div>
          <label class="field">
            <span><span data-i18n="f.steps"></span> <em data-i18n="f.steps_hint"></em></span>
            <textarea name="steps" rows="5" data-i18n-ph="f.steps_ph" dir="auto"></textarea>
          </label>
          <details class="syntax" data-mode="url">
            <summary data-i18n="syntax.title"></summary>
            <table id="syntax-table"></table>
            <p data-i18n="syntax.note"></p>
          </details>
          <label class="field">
            <span><span data-i18n="f.condition"></span> <em data-i18n="f.condition_hint"></em></span>
            <input name="success_condition" data-i18n-ph="f.condition_ph" dir="auto">
          </label>
          <div class="grid-2">
            <label class="field">
              <span><span data-i18n="f.features"></span> <em data-i18n="f.features_hint"></em></span>
              <textarea name="expected_features" rows="4" dir="auto"></textarea>
            </label>
            <label class="field">
              <span><span data-i18n="f.events"></span> <em data-i18n="f.events_hint"></em></span>
              <textarea name="expected_events" rows="4" data-i18n-ph="f.events_ph" dir="auto"></textarea>
            </label>
          </div>
        </div>
      </details>

      <div class="actions" data-mode="file" hidden>
        <button type="submit" class="btn primary big"><span data-i18n="home.start"></span><svg class="i flip"><use href="#i-arrow"/></svg></button>
      </div>

      <section class="features">
        <div><span class="f-icon"><svg class="i"><use href="#i-layers"/></svg></span><strong data-i18n="feat.1.t"></strong><small data-i18n="feat.1.d"></small></div>
        <div><span class="f-icon"><svg class="i"><use href="#i-zap"/></svg></span><strong data-i18n="feat.2.t"></strong><small data-i18n="feat.2.d"></small></div>
        <div><span class="f-icon"><svg class="i"><use href="#i-file"/></svg></span><strong data-i18n="feat.3.t"></strong><small data-i18n="feat.3.d"></small></div>
        <div><span class="f-icon"><svg class="i"><use href="#i-shield"/></svg></span><strong data-i18n="feat.4.t"></strong><small data-i18n="feat.4.d"></small></div>
      </section>

      <section class="flow">
        <h2><span data-i18n="flow.title"></span></h2>
        <ol>
          <li><span class="f-circle"><svg class="i"><use href="#i-link"/></svg></span><span data-i18n="flow.1"></span></li>
          <li><span class="f-circle"><svg class="i"><use href="#i-cpu"/></svg></span><span data-i18n="flow.2"></span></li>
          <li><span class="f-circle"><svg class="i"><use href="#i-file"/></svg></span><span data-i18n="flow.3"></span></li>
          <li><span class="f-circle"><svg class="i"><use href="#i-chart"/></svg></span><span data-i18n="flow.4"></span></li>
        </ol>
      </section>

      <p class="demo-line">
        <span data-i18n="demo.line"></span>
        <button type="button" id="load-demo" class="linkish" data-i18n="demo.fill"></button>
        <span data-i18n="demo.or"></span>
        <a id="demo-link" href="/results.html?id=demo" data-i18n="demo.open"></a>
      </p>
    </div>
  </form>

  <section id="waiting" class="waiting" hidden aria-live="polite">
    <div class="wait-card">
      <div class="spinner" aria-hidden="true"></div>
      <h2 data-i18n="wait.title"></h2>
      <p id="progress" class="progress-text"></p>
      <ol class="stages" id="stages">
        <li data-stage="collect" data-i18n="wait.s1"></li>
        <li data-stage="analyze" data-i18n="wait.s2"></li>
        <li data-stage="finish" data-i18n="wait.s3"></li>
      </ol>
      <p class="muted small" data-i18n="wait.note"></p>
    </div>
  </section>
</main>

<script src="/js/shell.js"></script>
<script src="/js/form.js"></script>
</body>
</html>
